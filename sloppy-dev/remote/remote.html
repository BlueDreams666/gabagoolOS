<style>
:root{--bg:#0d1219;--card:#18202b;--card2:#242f3d;--text:#fff;--sub:#b3bfcb;--dim:#7d8a98;--line:rgba(179,191,203,.14);--track:rgba(255,255,255,.16);
--acc:#72d8cd;--acct:#72d8cd;--ink:#182735;--sh:0 1px 0 rgba(255,255,255,.04) inset;--glow:.10;
--f:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Noto Sans","PingFang SC","Microsoft YaHei",sans-serif;
--fast:120ms;--page:220ms;--slow:320ms;--ease:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme:light){:root{--bg:#f1f4f7;--card:#fff;--card2:#dfe6ed;--text:#182735;--sub:#43576a;--dim:#5a7082;--line:rgba(24,39,53,.09);
--track:rgba(24,39,53,.14);--sh:0 1px 2px rgba(24,39,53,.06),0 8px 24px rgba(24,39,53,.06);--glow:.07}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark light}
body{margin:0;color:var(--text);font:400 17px/1.35 var(--f);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 14px);
background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--acc) calc(var(--glow)*100%),transparent),transparent 70%) no-repeat,var(--bg);min-height:100vh}
main{max-width:480px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}main>*{min-width:0}
@media (min-width:860px){main{max-width:920px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.np{grid-row:span 3;position:sticky;top:14px}}
header{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:8px;height:44px;padding:0 6px}
@media (min-width:860px){header{max-width:920px}}
.mark{font:italic 800 21px/1 Georgia,"Times New Roman",serif;letter-spacing:-.3px;color:var(--acct)}
.st{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);opacity:0;transition:opacity var(--page) var(--ease)}
.st i{width:8px;height:8px;border-radius:4px;background:#e5534b}.off .st{opacity:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:20px}
.np{padding:20px 20px 16px}
.art{position:relative;width:min(100%,340px);aspect-ratio:1;margin:0 auto 18px;border-radius:14px;overflow:hidden;
background:linear-gradient(145deg,var(--card2),color-mix(in srgb,var(--card2) 70%,var(--acc)));box-shadow:0 10px 30px rgba(0,0,0,.28)}
.art svg{position:absolute;inset:0;margin:auto;width:28%;height:28%;color:var(--dim);opacity:.7}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity var(--slow) var(--ease)}
.art img.on{opacity:1}
.meta{display:flex;align-items:center;gap:12px;min-height:72px}.meta>div{flex:1;min-width:0}
.t{font-weight:700;font-size:22px;line-height:1.25;letter-spacing:-.2px}
.a{color:var(--sub);margin-top:2px}.al{color:var(--dim);font-size:15px;margin-top:1px}
.t,.a,.al,.rt,.ra{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:var(--text);background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
border-radius:28px;transition:transform var(--fast) var(--ease),background-color var(--page) var(--ease),color var(--page) var(--ease),opacity var(--page)}
button:active{transform:scale(.94)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acct);outline-offset:2px}
button:disabled{opacity:.35;pointer-events:none}
@media (hover:hover){button:hover{background:color-mix(in srgb,var(--text) 7%,transparent)}}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
.ib{width:44px;height:44px;color:var(--sub)}
.love{color:var(--sub)}.love.on{color:var(--acct)}
.love.on svg{animation:pop var(--slow) var(--ease)}
@keyframes pop{40%{transform:scale(1.22)}}
.seek{margin:14px 0 0;direction:ltr}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;background:transparent;cursor:pointer;--p:0%;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc) var(--p),var(--track) var(--p))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc) var(--p),var(--track) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;border-radius:9px;background:#fff;
box-shadow:0 1px 4px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.08);transition:transform var(--fast) var(--ease)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:9px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.3)}
.times{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;margin-top:2px;direction:ltr}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:10px -4px 0;direction:ltr}
.ctl button{flex:none}.ctl .sk{width:60px;height:60px}.ctl .sk svg{width:34px;height:34px}
.ctl .md{width:48px;height:48px;color:var(--dim);position:relative}
.ctl .md.on{color:var(--acct)}
.ctl .md.on::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:currentColor}
.play{width:76px;height:76px;border-radius:38px;background:var(--acc);color:var(--ink);box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 35%,transparent)}
.play svg{width:36px;height:36px}
@media (hover:hover){.play:hover{background:color-mix(in srgb,var(--acc) 88%,var(--text))}}
.vol{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--dim);direction:ltr}
.vol svg{width:20px;height:20px}
.vol span{min-width:36px;text-align:end;font-size:13px;font-variant-numeric:tabular-nums}
h2{font:600 13px/1 var(--f);letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin:6px 6px 10px}
.list{padding:6px}
.row{display:flex;align-items:center;gap:8px;min-height:60px;padding:8px 6px 8px 14px;border-radius:14px;cursor:pointer;transition:background-color var(--fast)}
.row:active{background:color-mix(in srgb,var(--text) 8%,transparent)}
@media (hover:hover){.row:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}}
.row{position:relative}.row+.row::before{content:"";position:absolute;top:0;inset-inline:14px 6px;height:1px;background:var(--line)}
.row>div{flex:1;min-width:0}.rt{font-weight:600;font-size:16px}.ra{color:var(--sub);font-size:14px;margin-top:1px}
.chip{font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--acct);border:1px solid color-mix(in srgb,var(--acct) 45%,transparent);border-radius:6px;padding:2px 6px;flex:none}
.row .ib{width:40px;height:40px}
.empty{color:var(--dim);padding:16px 14px;font-size:15px}
.more{color:var(--dim);font-size:13px;padding:6px 14px 8px}
.q{position:relative;margin:0 0 4px}
.q svg{position:absolute;top:0;bottom:0;margin:auto;inset-inline-start:16px;width:20px;height:20px;fill:var(--dim)}
input[type=search]{width:100%;font:inherit;color:var(--text);background:var(--card2);border:1px solid transparent;border-radius:28px;height:48px;
padding:0 18px;padding-inline-start:46px;outline:none;-webkit-appearance:none;appearance:none;transition:border-color var(--page),background-color var(--page)}
input[type=search]:focus{border-color:var(--acct);background:var(--card)}
input::placeholder{color:var(--dim)}
.hint{display:none;align-items:flex-start;gap:12px}.hint.on{display:flex}
.hint img{width:44px;height:44px;border-radius:10px;flex:none}
.hint b{display:block;font-size:16px}.hint p{margin:2px 0 0;color:var(--sub);font-size:14px}
.hint button{margin-inline-start:auto;color:var(--acct);font-weight:600;font-size:15px;height:36px;padding:0 10px;flex:none}
.foot{display:flex;flex-direction:column;align-items:center;gap:12px}
.ghost{height:44px;padding:0 20px;border:1px solid var(--line);color:var(--sub);font-size:15px;background:var(--card)}
#shot{display:none;width:100%;max-width:240px;border-radius:14px;border:1px solid var(--line);box-shadow:0 6px 28px rgba(0,0,0,.35)}
.up p{margin:0 0 14px;color:var(--sub);font-size:15px}.up .ghost{width:100%}
.ub{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin:0 0 14px}.ub i{display:block;height:100%;width:0;border-radius:3px;background:var(--acc);transition:width var(--fast) var(--ease)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,16px);opacity:0;pointer-events:none;
background:var(--text);color:var(--bg);font-size:15px;font-weight:600;padding:10px 18px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.3);
transition:opacity var(--page) var(--ease),transform var(--page) var(--ease)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.off main{opacity:.55;transition:opacity var(--page)}
.lock main>section:not(#pair){display:none}.lock .st{opacity:0}
.pair h2{margin:0 0 6px}.pair p{margin:0 0 16px;color:var(--sub);font-size:15px}
#pc{width:100%;font:600 32px/1 var(--f);letter-spacing:10px;text-align:center;color:var(--text);background:var(--card2);border:1px solid transparent;
border-radius:16px;height:64px;outline:none;font-variant-numeric:tabular-nums;direction:ltr;transition:border-color var(--page)}
#pc:focus{border-color:var(--acct)}
#pe{min-height:20px;margin:10px 0 6px;color:#e5534b;font-size:14px}
.pair .play{width:100%;height:52px;border-radius:26px;font-weight:600;font-size:17px}
@media (max-width:340px){.ctl .md{width:40px}.ctl .sk{width:52px}.play{width:68px;height:68px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
